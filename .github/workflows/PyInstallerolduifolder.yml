name: PyInstaller oldui 文件夹版

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    # 1. 拉取你的仓库代码
    - uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        architecture: 'x64'

    # 3. 安装 PyInstaller 和项目依赖
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install tkinterdnd2

    # 4. 使用 PyInstaller 进行打包（文件夹模式）
    - name: Build with PyInstaller
      run: |
        # -D (--onedir) 打包成文件夹（默认行为，可省略）
        # -w 禁用黑色控制台窗口（适配 .pyw）
        # --name 指定生成的exe名字和文件夹名
        # --add-data 添加外部数据文件
        pyinstaller -D -w --name "FFmpeg简易转换合并" --add-data "ffmpeg_presets.json;." FFmpeg简易转换合并.pyw

    # 5. 上传整个 dist 文件夹（包含生成的程序文件夹及内部所有文件）
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PyInstaller-Folder-Build
        # 上传 dist 目录，其中包含 "FFmpeg简易转换合并" 子文件夹
        path: dist/
