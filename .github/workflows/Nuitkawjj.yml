name: Nuitka 手动打包 (Standalone 文件夹模式)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install tkinterdnd2

    - name: Build with Nuitka (standalone folder, no runtime extraction)
      shell: cmd
      run: |
        nuitka --standalone --windows-disable-console --enable-plugin=tk-inter --include-data-files=ffmpeg_presets.json=ffmpeg_presets.json --output-dir=dist --assume-yes-for-downloads "FFmpeg简易转换合并.pyw"

    - name: Upload artifact (entire dist folder)
      uses: actions/upload-artifact@v4
      with:
        name: Nuitka-Standalone-Build
        path: dist/*.dist
