  # ========== 任务 6：汇总全部产物并创建 Release ==========
  create-release:
    needs: [build-and-release, build-and-release-win7, build-multi, build-multi-win7]
    runs-on: windows-latest
    # 修复1：为 create-release 任务添加权限
    permissions:
      contents: write
    steps:
      # 修复1：添加 checkout，以便 git describe 能正常获取版本号
      - uses: actions/checkout@v6

      - name: 下载默认构建产物
        uses: actions/download-artifact@v4
        with:
          name: default-build-artifact
          path: upload_files

      - name: 下载 Win7 构建产物
        uses: actions/download-artifact@v4
        with:
          name: win7-build-artifact
          path: upload_files

      - name: 下载 Multi 默认构建产物
        uses: actions/download-artifact@v4
        with:
          name: multi-build-artifact
          path: upload_files

      - name: 下载 Multi Win7 构建产物
        uses: actions/download-artifact@v4
        with:
          name: multi-win7-build-artifact
          path: upload_files

      - name: 获取版本号
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $VER = "${{ github.event.inputs.version }}"
          } else {
            $VER = git describe --tags --always --dirty 2>$null
            if (-not $VER) { $VER = "continuous-${{ github.run_number }}" }
          }
          echo "VERSION=$VER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            自动构建版本 ${{ env.VERSION }}

            - 包含 **FFmpeg简易转换合并newui** (文件夹便携版)
            - 内置 **水印轨迹编排器 多轨道** 可执行文件
            - 同时提供 **forwin7_orX86** 兼容版本 (Python 3.8.10 + x86)
            - 另含 **FFmpegLiteGUIMulti** 多语言版 (中/英) 文件夹便携版，含 x64 最新 Python 与 forwin7_orX86 (Python 3.8.10 + x86) 两种构建，不打包轨迹编辑子程序
          files: upload_files/*.zip
          draft: false
          prerelease: false
          # 修复2：移除了不支持的 overwrite: true 参数
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
