          }

      - name: 构建附属程序 (文件夹版)
        shell: pwsh
        run: |
          $subName = "水印轨迹编排器_多轨道_folder_${{ env.VERSION }}_forwin7_orX86"
          pyinstaller -D -w --name $subName --icon 35.ico --version-file version1.txt "水印轨迹编排器 多轨道.pyw"
          echo "SUB_EXE_DIR=dist\$subName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 合并产物
        shell: pwsh
        run: |
          Write-Host "正在将附属程序复制到主程序目录..."
          $subExe = Get-ChildItem -Path $env:SUB_EXE_DIR -Filter "*.exe" | Select-Object -First 1
          if (-not $subExe) {
            Write-Error "未找到附属程序的 exe 文件！"
            exit 1
          }
