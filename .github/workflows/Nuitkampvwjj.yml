name: Nuitka 手动打包 MPV PRVW‌ ver (Standalone 文件夹模式)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: List files in repository (debug)
      run: dir
      shell: cmd

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install tkinterdnd2

    - name: Build with Nuitka (standalone folder)
      shell: cmd
      run: |
        REM 请根据你的实际脚本名修改下面的文件名
        nuitka --standalone --windows-disable-console --enable-plugin=tk-inter --include-data-files=ffmpeg_presets.json=ffmpeg_presets.json --output-dir=dist --assume-yes-for-downloads "FFmpeg简易转换合并newui.pyw"

    - name: List output directory (debug)
      run: dir dist
      shell: cmd

    - name: Upload artifact (use wildcard to catch any .dist folder)
      uses: actions/upload-artifact@v4
      with:
        name: Nuitka-Standalone-Build
        path: dist/*.dist
