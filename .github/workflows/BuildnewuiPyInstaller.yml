name: PyInstaller Build NewUI and Upload to Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（例如 v1.0.0），不填则自动生成'
        required: false
        default: ''

# 需要写入权限才能创建 Release 和上传附件
permissions:
  contents: write

jobs:
  # ---------- 1. 并行构建 NewUI 任务 ----------
  build:
    strategy:
      matrix:
        include:
          - mode: 'folder'
            script: 'FFmpeg简易转换合并newui.pyw'
            output_base: 'FFmpeg简易转换合并_newui_folder'
          - mode: 'single'
            script: 'FFmpeg简易转换合并newui.pyw'
            output_base: 'FFmpeg简易转换合并_newui_single'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: 'x64'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install tkinterdnd2

      - name: 构建（文件夹或单文件）
        shell: pwsh
        run: |
          if ("${{ matrix.mode }}" -eq "folder") {
            $modeFlag = "-D"
          } else {
            $modeFlag = "-F"
          }
          # 构建时加上临时版本号，防止多任务并发时产物名称冲突
          $tempVer = "${{ github.run_number }}"
          $finalName = "${{ matrix.output_base }}_$tempVer"
          pyinstaller $modeFlag -w --name $finalName --add-data "ffmpeg_presets.json;." "${{ matrix.script }}"

      - name: 上传构建产物（供后续 Release 使用）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_base }}_${{ github.run_number }}
          path: dist/

  # ---------- 2. 汇总并发布到 Release ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4  # 必须 checkout，否则 git describe 无法工作

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: 整理产物（压缩文件夹、收集 exe）
        run: |
          mkdir -p upload_files
          for dir in all_artifacts/*/; do
            artifact_name=$(basename "$dir")
            echo "正在处理 artifact: $artifact_name"
            
            content_path="$dir/dist"
            if [ ! -d "$content_path" ]; then
              content_path="$dir"
            fi
            
            cd "$content_path"
            for item in *; do
              if [ -d "$item" ]; then
                echo "发现文件夹: $item，正在压缩..."
                zip -r "../../upload_files/${item}.zip" "$item"
              elif [ -f "$item" ] && [[ "$item" == *.exe ]]; then
                echo "发现 exe: $item，正在复制..."
                cp "$item" "../../upload_files/"
              else
                echo "忽略其他文件: $item"
              fi
            done
            cd - > /dev/null
          done
          
          echo "===== 准备上传的文件列表 ====="
          ls -l upload_files/
          if [ -z "$(ls -A upload_files)" ]; then
            echo "::error::upload_files 目录为空，没有可上传的文件！"
            exit 1
          fi

      - name: 确定 Release 版本号
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # 优先使用 git tag，如果没有则使用 run_number
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "continuous-${{ github.run_number }}")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release 版本: $VERSION"

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "NewUI Release ${{ env.VERSION }}"
          body: |
            🚀 **NewUI 自动构建版本**: ${{ env.VERSION }}
            
            - 采用全新界面 (NewUI)
            - 包含文件夹版（便携）和单文件版 (.exe)
          files: |
            upload_files/*.exe
            upload_files/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
