name: Nuitka 自动打包 pyw 为 exe

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    # 1. 拉取代码
    - uses: actions/checkout@v4

    # 2. 安装 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'           # Nuitka 推荐使用稳定版本
        architecture: 'x64'

    # 3. 安装 Nuitka 及项目依赖
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install tkinterdnd2
        # 如果你的脚本中还用了其他库，请在这里添加

    # 4. 使用 Nuitka 进行编译打包
    - name: Build with Nuitka
      run: |
        nuitka `
          --standalone `                         # 生成独立文件夹（包含所有依赖）
          --onefile `                            # 最终打包成单个 exe（原生无解压）
          --windows-disable-console `            # 等同于 pyinstaller 的 -w，隐藏控制台（.pyw 模式）
          --windows-icon-from-ico=icon.ico `     # 如果有自定义图标可以替换，没有则删除此行
          --enable-plugin=tk-inter `             # 必须，否则 Tkinter GUI 无法正常工作
          --include-data-files=ffmpeg_presets.json=./ffmpeg_presets.json `   # 包含预设文件
          --output-dir=dist `                    # 输出目录
          --output-name=FFmpeg简易转换合并 `       # 生成的 exe 名称（不要加 .exe）
          --assume-yes-for-downloads `           # 自动下载缺失的 C 编译器依赖
          FFmpeg简易转换合并.pyw                  # 主脚本

    # 5. 上传成品 exe
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nuitka-Windows-Build
        path: dist/FFmpeg简易转换合并.exe
