name: PyInstaller newui 打包为单文件

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        architecture: 'x64'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install tkinterdnd2

    - name: Build with PyInstaller (single-file mode)
      run: |
        # 使用 -F 生成单个可执行文件
        # -w 隐藏控制台，适配 .pyw
        # --name 指定生成的主 exe 名称
        # --add-data 添加额外数据文件
        pyinstaller -F -w --name "FFmpeg简易转换合并" --add-data "ffmpeg_presets.json;." "mpvPRVW‌ver.pyw"

    - name: Upload artifact (single exe)
      uses: actions/upload-artifact@v4
      with:
        name: PyInstaller-SingleFile-Build
        # 单文件模式下 dist 目录中只包含一个 .exe 文件
        path: dist/
